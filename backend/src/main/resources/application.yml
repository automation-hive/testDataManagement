server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dashboardforge}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

dashboardforge:
  rest:
    # Comma-separated exact hostnames. Only HTTPS on port 443 is allowed.
    allowed-hosts: ${REST_ALLOWED_HOSTS:}
    # Optional server-side bearer token; never send API secrets from the browser.
    bearer-token: ${REST_API_BEARER_TOKEN:}
